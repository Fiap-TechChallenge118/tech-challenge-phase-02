name: CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Lint + testes unitários
  # Não precisa de dados: todos os testes usam fixtures sintéticas.
  # O pyproject.toml aponta torch para o índice CPU — sem downloads CUDA no CI.
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependências
        run: make install

      - name: Lint + format check
        run: make check

      - name: Testes unitários
        run: make test

      - name: Validar DAG do DVC
        run: make dvc-dag

  # ---------------------------------------------------------------------------
  # Job 2 — Testes de integração (requer dados do DVC)
  # Executa apenas quando o secret DVC_REMOTE_URL estiver configurado.
  # Baixa os artefatos processados (model.pt, test_pairs.parquet) via dvc pull
  # para que os testes de integração possam rodar contra dados reais.
