[project]
name = "tech-challenge-02"
version = "0.1.0"
description = "Tech Challenge 02 — Sistema de recomendação de produtos baseado em redes neurais (MLP/Embedding) com pipeline MLOps end-to-end."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.13",
    "mlflow>=2.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandera>=0.19",
    "joblib>=1.4",
    "httpx>=0.27",
    "ipykernel>=7.2.0",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "kagglehub>=1.0.2",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "nbconvert>=7.17.1",
    "pre-commit>=4.6.0",
    "ruff>=0.15.17",
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "seaborn>=0.13.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::FutureWarning:pandera",
    "ignore::DeprecationWarning:mlflow",
]
